name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak proyek dari zip
        run: |
          if [ -f DailyCheckQQ-native.zip ]; then unzip -q -o DailyCheckQQ-native.zip; fi
          ls

      - name: Build APK
        run: |
          cd DailyCheckQQ-native
          gradle assembleDebug --no-daemon --stacktrace

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyCheckQQ-apk
          path: DailyCheckQQ-native/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DailyCheckQQ build ${{ github.run_number }}
          files: DailyCheckQQ-native/app/build/outputs/apk/debug/app-debug.apk
